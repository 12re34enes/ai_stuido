[project]
name = "aistudio"
version = "0.1.0"
description = "AI Studio backend (studiod): agent orchestration engine"
requires-python = ">=3.13"
dependencies = [
    # API / runtime
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28",
    "websockets>=13",
    # storage
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    # security
    "keyring>=25",
    # templates / config
    "jinja2>=3.1",
    "pyyaml>=6",
    # scheduling / fs
    "croniter>=5",
    "watchfiles>=1.0",
    # remote
    "asyncssh>=2.18",
    "sqlglot>=26",
    "bashlex>=0.18",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "pymongo>=4.10",
    "redis>=5.2",
    "pymssql>=2.3",
    # alerts
    "aiosmtplib>=3",
    "slack-sdk>=3.33",
    "aiohttp>=3.11",
]

[project.scripts]
studiod = "aistudio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
filterwarnings = [
    "error::RuntimeWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018", "SIM117", "ASYNC109", "ASYNC240"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
