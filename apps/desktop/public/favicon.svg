<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AI Studio mark: an "A" drawn as a small flow graph (one lead node handing off to two
       agents, joined by a handoff bar) on a warm terracotta tile. Original artwork. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#E58A63"/>
      <stop offset="0.55" stop-color="#CF6A45"/>
      <stop offset="1" stop-color="#B4532F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="512" y1="240" x2="512" y2="760">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#F6E6D6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5A2412" flood-opacity="0.28"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B2A14" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>

  <g filter="url(#markShadow)" fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M512 330 L356 688" stroke-width="58"/>
    <path d="M512 330 L668 688" stroke-width="58"/>
    <!-- handoff bar -->
    <path d="M428 556 H596" stroke-width="44"/>
  </g>
  <g filter="url(#markShadow)" fill="url(#ink)">
    <circle cx="512" cy="318" r="78"/>
    <circle cx="352" cy="696" r="58"/>
    <circle cx="672" cy="696" r="58"/>
  </g>
  <!-- lead node core -->
  <circle cx="512" cy="318" r="30" fill="#CF6A45"/>
</svg>
