[package]
name = "ai-studio"
version = "0.1.0"
description = "AI Studio desktop shell (Tauri 2)"
authors = ["AI Studio"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ai_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "ai-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-log = "2.10.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
security-framework = "3"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSBundle",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSSet",
  "NSString",
  "NSArray",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
